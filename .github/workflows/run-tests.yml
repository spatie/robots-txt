name: Tests

on: [push, pull_request]

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                php: ['8.6', '8.5', '8.4']
                dependency-version: [prefer-stable]

        name: P${{ matrix.php }} - ${{ matrix.dependency-version }} - ${{ matrix.os }}

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Install and start test server
                run: |
                    cd tests/server
                    npm install
                    (node server.js &) || /bin/true

            -   name: Wait for server bootup
                run: sleep 5

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
                    coverage: none

            -   name: Verify PHP version
                env:
                    EXPECTED_PHP_VERSION: ${{ matrix.php }}
                run: |
                    php -r 'echo PHP_VERSION, PHP_EOL; exit(PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION === getenv("EXPECTED_PHP_VERSION") ? 0 : 1);'

            -   name: Install dependencies
                run: composer update --no-interaction --prefer-dist

            -   name: Execute tests
                run: vendor/bin/phpunit --fail-on-skipped --fail-on-phpunit-deprecation
